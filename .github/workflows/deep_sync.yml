name: Deep Sync Album Pipeline

on:
  schedule:
    # Runs at 05:00 AM UTC on the 1st of every month
    - cron: '0 5 1 * *'
  workflow_dispatch: # Allows you to also trigger it manually from the GitHub website

jobs:
  deep-sync:
    runs-on: ubuntu-latest

    # Run 4 shards of the same full rebuild in parallel instead of one long
    # serial pass. A FULL_SYNC re-enriches every album against MusicBrainz
    # (3+ calls/album at ~1.1s each) which had consistently been taking
    # 4-6+ hours -- right up against, and on 2026-08-21 past, GitHub
    # Actions' hard 6h per-job cap (see issue #13). Each shard here gets a
    # disjoint 1/4 slice of the album list (via SHARD_INDEX/SHARD_COUNT,
    # applied in ingestion/album_push_logic.py) and runs on its own
    # GitHub-hosted runner with its own IP, so MusicBrainz's 1 req/sec-per-IP
    # limit is respected independently by each shard with no coordination
    # needed between them. fail-fast: false so one shard's failure doesn't
    # cancel the other three's progress.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
    # 1. Check out your code from GitHub onto the cloud runner
    - name: Check out repository code
      uses: actions/checkout@v4

    # 2. Set up Python on the cloud environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # Automatically caches your packages for faster subsequent runs

    # 3. Install all dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Execute this shard's slice of the forced full rebuild
    # We pass the GitHub secrets into the runner's environment variables
    - name: Run Python script (full rebuild, shard ${{ matrix.shard }}/4)
      env:
        notion_key: ${{ secrets.NOTION_KEY }}
        database_id: ${{ secrets.DATABASE_ID }}
        spotify_key: ${{ secrets.SPOTIFY_KEY }}
        spotify_id: ${{ secrets.SPOTIFY_ID }}
        email: ${{ secrets.EMAIL }}
        supabase_url: ${{ secrets.SUPABASE_URL }}
        supabase_key: ${{ secrets.SUPABASE_KEY }}
        FULL_SYNC: "true"
        SHARD_INDEX: ${{ matrix.shard }}
        SHARD_COUNT: "4"
      run: |
        python -m src.ingestion.album_push_logic